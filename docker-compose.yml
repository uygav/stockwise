services:
  postgres:
    image: postgres:16-alpine
    container_name: stockwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockwise
      POSTGRES_USER: stockwise
      POSTGRES_PASSWORD: stockwise_dev_password
    ports:
      - "5433:5432"
    volumes:
      - stockwise_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwise -d stockwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stockwise-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: stockwise
      DB_USER: stockwise
      DB_PASSWORD: stockwise_dev_password
      JWT_SECRET: so_secret_key_password_changeit
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stockwise-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  stockwise_pgdata:
